name: Quant Vault State Sync

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Artifact ID matching workflows/vault_manifests/<artifact_id>.manifest.json"
        required: true
        type: string
      mode:
        description: "Hydrate from hot cache/Drive or verify cached payload"
        required: true
        default: "hydrate"
        type: choice
        options:
          - hydrate
          - verify-manifest

permissions:
  contents: read

# Enforce single-writer lock across concurrent Drive/Vault state workflows.
concurrency:
  group: alpha-vault-${{ inputs.artifact_id }}
  cancel-in-progress: false

jobs:
  vault-hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect manifest and resolve deterministic cache key
        id: manifest
        env:
          INPUT_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_ARTIFACT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid artifact_id: $INPUT_ARTIFACT_ID" >&2
            exit 1
          fi
          MANIFEST_PATH="workflows/vault_manifests/${INPUT_ARTIFACT_ID}.manifest.json"
          if [[ ! -f "$MANIFEST_PATH" ]]; then
            echo "Manifest not found: $MANIFEST_PATH" >&2
            exit 1
          fi
          CACHE_KEY=$(python3 scripts/vault_sync.py cache-key --manifest "$MANIFEST_PATH")
          ARCHIVE_NAME=$(python3 -c 'import json, sys; name = json.load(open(sys.argv[1], encoding="utf-8"))["archive_name"]; assert "/" not in name and "\\" not in name and ".." not in name; print(name)' "$MANIFEST_PATH")
          {
            echo "manifest_path=$MANIFEST_PATH"
            echo "cache_key=$CACHE_KEY"
            echo "archive_name=$ARCHIVE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Hydrate Hot Storage (GitHub Actions Cache <= 10 GB)
        id: hot_cache
        uses: actions/cache@v4
        with:
          path: .vault_cache
          key: ${{ steps.manifest.outputs.cache_key }}

      - name: Restore from Master Vault (Google Drive via rclone) on cache miss
        if: ${{ inputs.mode == 'hydrate' && steps.hot_cache.outputs.cache-hit != 'true' }}
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          RCLONE_CONFIG_GDRIVE_DATA: ${{ secrets.RCLONE_CONFIG_GDRIVE }}
        run: |
          set -euo pipefail
          if [[ -z "${RCLONE_CONFIG_GDRIVE_DATA:-}" ]]; then
            echo "Hot cache miss and RCLONE_CONFIG_GDRIVE secret is not set; skipping remote Drive download."
            echo "Run locally via 'python3 scripts/vault_sync.py pull-drive --manifest $MANIFEST_PATH' or configure RCLONE_CONFIG_GDRIVE."
            exit 0
          fi
          RCLONE_TMP=$(mktemp)
          trap 'rm -f "$RCLONE_TMP"' EXIT
          chmod 600 "$RCLONE_TMP"
          printf '%s\n' "$RCLONE_CONFIG_GDRIVE_DATA" > "$RCLONE_TMP"
          RCLONE_CONFIG="$RCLONE_TMP" python3 scripts/vault_sync.py pull-drive \
            --manifest "$MANIFEST_PATH" \
            --dest .vault_staging \
            --backend rclone

      - name: Verify SHA-256 archive integrity when cached locally
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest_path }}
          ARCHIVE_NAME: ${{ steps.manifest.outputs.archive_name }}
        run: |
          set -euo pipefail
          ARCHIVE=".vault_cache/$ARCHIVE_NAME"
          if [[ -f "$ARCHIVE" ]]; then
            python3 scripts/vault_sync.py verify-archive \
              --manifest "$MANIFEST_PATH" \
              --archive "$ARCHIVE"
          else
            echo "Archive not present in Actions runner cache (manifest validated)."
          fi
