name: Deploy Beta Mining Dashboard (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - "beta_mining/**"
      - ".github/workflows/deploy-beta-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public Beta Mining dashboard site (fail-closed)
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -f beta_mining/index.html
          test -f beta_mining/daily/index.json
          test -f beta_mining/ranking_top9.json

          rm -rf pages_site
          mkdir -p pages_site/daily
          cp beta_mining/index.html pages_site/index.html
          cp beta_mining/ranking_top9.json pages_site/ranking_top9.json
          cp beta_mining/daily/index.json pages_site/daily/index.json
          touch pages_site/.nojekyll

          # Copy every valid YYYY-MM-DD daily dashboard & summary (never expose repo source or raw model folders)
          copied_days=0
          for ddir in beta_mining/daily/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]; do
            if [[ -d "$ddir" ]]; then
              bdate=$(basename "$ddir")
              mkdir -p "pages_site/daily/${bdate}"
              if [[ -f "${ddir}/dashboard.html" ]]; then
                cp "${ddir}/dashboard.html" "pages_site/daily/${bdate}/dashboard.html"
                copied_days=$((copied_days + 1))
              fi
              if [[ -f "${ddir}/daily_summary.md" ]]; then
                cp "${ddir}/daily_summary.md" "pages_site/daily/${bdate}/daily_summary.md"
              fi
            fi
          done

          if [[ "$copied_days" -lt 1 ]]; then
            echo "No daily dashboard.html files found under beta_mining/daily/" >&2
            exit 1
          fi
          echo "Staged ${copied_days} historical daily dashboard(s) into pages_site/"
          find pages_site -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
