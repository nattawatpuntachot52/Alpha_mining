name: "Deploy Unified Research Portal (GitHub Pages | Central + Alpha + Beta)"

on:
  push:
    branches:
      - main
    paths:
      - "beta_mining/**"
      - "alpha_mining/**"
      - "python/alpha_mining/research/portal_hub.py"
      - "scripts/build_portal.py"
      - ".github/workflows/deploy-beta-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage Unified Central Portal, Alpha Track & Beta Track (fail-closed)
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -f beta_mining/index.html
          test -f beta_mining/daily/index.json
          test -f beta_mining/ranking_top9.json

          rm -rf pages_site
          mkdir -p pages_site/beta/daily pages_site/daily
          touch pages_site/.nojekyll

          # 1. Build Unified Central Portal at site root (separating Alpha & Beta cleanly)
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_portal.py \
            --alpha-dir alpha_mining \
            --beta-dir beta_mining \
            --alpha-prefix alpha \
            --beta-prefix beta \
            --out pages_site/index.html
          test -f pages_site/index.html

          # 2. Stage Beta Track under pages_site/beta/ (+ legacy /daily/<date>/ redirect for existing bookmarks)
          cp beta_mining/index.html pages_site/beta/index.html
          cp beta_mining/ranking_top9.json pages_site/beta/ranking_top9.json
          cp beta_mining/daily/index.json pages_site/beta/daily/index.json
          cp beta_mining/ranking_top9.json pages_site/ranking_top9.json
          cp beta_mining/daily/index.json pages_site/daily/index.json

          copied_beta_days=0
          for ddir in beta_mining/daily/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]; do
            if [[ -d "$ddir" ]]; then
              bdate=$(basename "$ddir")
              mkdir -p "pages_site/beta/daily/${bdate}" "pages_site/daily/${bdate}"
              if [[ -f "${ddir}/dashboard.html" ]]; then
                cp "${ddir}/dashboard.html" "pages_site/beta/daily/${bdate}/dashboard.html"
                printf '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta http-equiv="refresh" content="0;url=../../beta/daily/%s/dashboard.html"><title>Redirecting to Beta Dashboard</title></head><body style="background:#0b1017;color:#e6edf6;font-family:sans-serif;padding:24px"><p>Redirecting to <a style="color:#93c5fd" href="../../beta/daily/%s/dashboard.html">Beta Dashboard (%s)</a>...</p></body></html>\n' "$bdate" "$bdate" "$bdate" > "pages_site/daily/${bdate}/dashboard.html"
                copied_beta_days=$((copied_beta_days + 1))
              fi
              if [[ -f "${ddir}/daily_summary.md" ]]; then
                cp "${ddir}/daily_summary.md" "pages_site/beta/daily/${bdate}/daily_summary.md"
                cp "${ddir}/daily_summary.md" "pages_site/daily/${bdate}/daily_summary.md"
              fi
            fi
          done

          if [[ "$copied_beta_days" -lt 1 ]]; then
            echo "No daily dashboard.html files found under beta_mining/daily/" >&2
            exit 1
          fi
          echo "Staged ${copied_beta_days} historical Beta daily dashboard(s) into pages_site/beta/"

          # 3. Stage Alpha Track under pages_site/alpha/ when present
          copied_alpha_days=0
          if [[ -f alpha_mining/index.html ]] && [[ -f alpha_mining/daily/index.json ]]; then
            mkdir -p pages_site/alpha/daily
            cp alpha_mining/index.html pages_site/alpha/index.html
            cp alpha_mining/daily/index.json pages_site/alpha/daily/index.json
            if [[ -f alpha_mining/ranking_top9.json ]]; then
              cp alpha_mining/ranking_top9.json pages_site/alpha/ranking_top9.json
            fi
            for ddir in alpha_mining/daily/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]; do
              if [[ -d "$ddir" ]]; then
                bdate=$(basename "$ddir")
                mkdir -p "pages_site/alpha/daily/${bdate}"
                if [[ -f "${ddir}/dashboard.html" ]]; then
                  cp "${ddir}/dashboard.html" "pages_site/alpha/daily/${bdate}/dashboard.html"
                  copied_alpha_days=$((copied_alpha_days + 1))
                fi
                if [[ -f "${ddir}/daily_summary.md" ]]; then
                  cp "${ddir}/daily_summary.md" "pages_site/alpha/daily/${bdate}/daily_summary.md"
                fi
              fi
            done
            echo "Staged ${copied_alpha_days} historical Alpha daily dashboard(s) into pages_site/alpha/"
          fi
          # 4. Remove duplicate sub-hubs: /alpha/ and /beta/ jump straight to the latest dashboard
          python3 - <<'PYEOF'
          import json, pathlib
          for name in ("alpha", "beta"):
              idx = pathlib.Path(f"pages_site/{name}/daily/index.json")
              if not idx.is_file():
                  continue
              latest = json.loads(idx.read_text(encoding="utf-8")).get("latest_date", "")
              target = f"daily/{latest}/dashboard.html"
              if latest and pathlib.Path(f"pages_site/{name}/{target}").is_file():
                  pathlib.Path(f"pages_site/{name}/index.html").write_text(
                      '<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">'
                      '<script>location.replace("' + target + '"+location.hash)</script>'
                      '<meta http-equiv="refresh" content="0;url=' + target + '">'
                      '<title>Redirecting</title></head><body><a href="' + target + '">เปิดหน้าล่าสุด</a></body></html>',
                      encoding="utf-8")
          PYEOF
          find pages_site -maxdepth 4 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
