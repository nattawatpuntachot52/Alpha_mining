name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify AGENTS.md and CLAUDE.md 1:1 mirror
        run: cmp -s AGENTS.md CLAUDE.md
      - name: Install Rust toolchain components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Rust format check
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Rust check
        run: cargo check --manifest-path rust/Cargo.toml --all-targets --locked
      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets --locked
      - name: Rust Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings

  python:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Validate GitHub Ruleset configuration invariants
        run: python3 scripts/github_ruleset.py validate-configs
      - name: Run Python control-plane, storage vault, and domain tests
        run: python3 -m unittest discover -s python/tests -v
