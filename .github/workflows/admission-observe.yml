name: Admission Observe

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  observe-evaluate:
    runs-on: ubuntu-latest
    steps:
      # Security: always check out trusted default branch (`main`), never untrusted PR head code.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate AdmissionPolicy schema and canonical digest
        run: python3 scripts/admission_gate.py validate-policy

      - name: Evaluate GitHub proactive rules in read-only Observe Mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          mkdir -p .observe_out
          python3 scripts/admission_gate.py observe-github \
            -R "$REPO_NAME" \
            --default-branch "$DEFAULT_BRANCH" \
            --ledger .observe_out/observe.jsonl \
            --json-out .observe_out/observe_report.json \
            --format markdown > .observe_out/observe_report.md
          cat .observe_out/observe_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Observe Mode ledger and report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admission-observe-report
          path: .observe_out/
          retention-days: 30
          if-no-files-found: ignore
